[project]
name = "flacli"
version = "0.1.0"
description = "Playlist sync and library tidying from the shell or over MCP: MusicBrainz canonicalisation, local library diff, Soulseek fetching through your own Nicotine+. Works with any agent that can run a command."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
keywords = ["music", "soulseek", "nicotine-plus", "playlists", "musicbrainz", "flac", "mcp", "cli", "agents"]
dependencies = [
    "mcp>=2.2,<3",
    "mutagen>=1.47",
    "ytmusicapi>=1.8",
]

[project.urls]
Homepage = "https://flacli.vercel.app"
Repository = "https://github.com/h-3303/flacli"

[project.scripts]
flacli = "flacli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "anyio>=4",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 120
addopts = "-ra"
